name: Frontend BDD

# Focused, always-on BDD job — runs only the Gherkin parity scenarios so
# cross-platform BDD has its own clearly-labeled CI signal alongside the
# broader frontend-tests.yml.
#
# FE-D.5 (2026-07-21): like frontend-tests.yml, this had never actually run —
# `paths: church-funds-ui/**` never matches anything in a repo whose root
# already IS church-funds-ui. Confirmed via `gh run list`: zero runs ever.
# Removed the bad `paths` filter and `working-directory`.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  bdd:
    name: BDD parity scenarios
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run BDD scenarios
        run: npm run test:bdd
